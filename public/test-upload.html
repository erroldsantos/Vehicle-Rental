<!DOCTYPE html>
<html>
<head>
    <title>License Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #5a67d8;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        #result.success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }
        #result.error {
            background: #fed7d7;
            color: #742a2a;
            display: block;
        }
    </style>
</head>
<body>
    <h1>License Upload Test</h1>
    
    <form id="uploadForm">
        <div class="form-group">
            <label for="userId">User ID:</label>
            <input type="number" id="userId" name="userId" value="2" required>
        </div>
        
        <div class="form-group">
            <label for="licenseImage">License Image:</label>
            <input type="file" id="licenseImage" name="licenseImage" accept="image/*" required>
        </div>
        
        <button type="submit">Upload License</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value;
            const fileInput = document.getElementById('licenseImage');
            const file = fileInput.files[0];
            
            if (!file) {
                showResult('error', 'Please select a file');
                return;
            }
            
            const formData = new FormData();
            formData.append('license_image', file);
            
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Uploading...';
            resultDiv.className = '';
            resultDiv.style.display = 'block';
            
            try {
                const response = await fetch(`/api/users/${userId}/license/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult('success', 'Success! ' + JSON.stringify(data, null, 2));
                } else {
                    showResult('error', 'Error: ' + (data.error || data.message || 'Upload failed'));
                }
            } catch (error) {
                showResult('error', 'Network error: ' + error.message);
            }
        });
        
        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = type;
            resultDiv.textContent = message;
        }
    </script>
</body>
</html>
